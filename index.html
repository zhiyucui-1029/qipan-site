<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StratVault · AI 战略分析，专业 PPT</title>
<meta name="description" content="描述你的战略问题，60秒生成一套咨询级分析报告 PPT。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf7;
    --surface: #fff;
    --border: #ebe7d9;
    --text: #1a1d24;
    --text-dim: #6b7280;
    --gold: #d7b36a;
    --gold-dark: #8a5d32;
    --dark: #1b2426;
    --dark-deep: #11191b;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Nav ── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(250,250,247,.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: 1240px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; height: 56px;
  }
  .logo {
    font-size: 17px; font-weight: 700; color: var(--text);
    text-decoration: none; letter-spacing: -.02em;
  }
  .logo-sub { font-weight: 400; color: var(--text-dim); font-size: 13px; }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    font-size: 14px; color: var(--text-dim); text-decoration: none;
    font-weight: 500; transition: color .2s;
  }
  .nav-links a:hover, .nav-links a.is-active { color: var(--text); }
  .nav-cta { display: flex; gap: 8px; }
  .btn-ghost, .btn-primary {
    padding: 7px 16px; border-radius: 8px; font-size: 13px;
    font-weight: 600; text-decoration: none; transition: all .2s;
  }
  .btn-ghost {
    color: var(--text); border: 1px solid var(--border);
    background: transparent;
  }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold-dark); }
  .btn-primary {
    background: var(--dark); color: #fff; border: 1px solid var(--dark);
  }
  .btn-primary:hover { background: #2a3436; }

  /* ── Main: Google-style centered layout ── */
  .main-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 24px 40px;
    min-height: 100vh;
  }

  /* ── Brand Mark ── */
  .brand-mark {
    margin-bottom: 48px;
    text-align: center;
  }
  .brand-name {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -.03em;
    color: var(--text);
    line-height: 1;
    margin-bottom: 12px;
  }
  .brand-name span {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .brand-tagline {
    font-size: 16px;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: .01em;
  }

  /* ── Search Box ── */
  .search-wrap {
    width: 100%;
    max-width: 640px;
    margin-bottom: 28px;
  }
  .search-box {
    position: relative;
    width: 100%;
  }
  .search-input {
    width: 100%;
    padding: 18px 56px 18px 24px;
    font-size: 16px;
    font-family: inherit;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: all .3s;
    box-shadow: 0 2px 12px rgba(0,0,0,.04);
  }
  .search-input::placeholder {
    color: #b0a898;
  }
  .search-input:focus {
    border-color: var(--gold);
    box-shadow: 0 4px 24px rgba(215,179,106,.18);
  }
  .search-btn {
    position: absolute;
    right: 6px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--dark);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .search-btn:hover { background: #2a3436; transform: translateY(-50%) scale(1.05); }
  .search-btn svg { width: 18px; height: 18px; }

  /* ── Scenario Suggestions ── */
  .scenarios {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 640px;
    margin-bottom: 60px;
  }
  .scenario-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 14px;
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    transition: all .25s;
    cursor: pointer;
  }
  .scenario-pill:hover {
    border-color: var(--gold);
    background: #fdf8ee;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(215,179,106,.15);
  }
  .scenario-pill .pill-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .scenario-pill:nth-child(1) .pill-icon { background: #fef3e2; }
  .scenario-pill:nth-child(2) .pill-icon { background: #eef4ff; }
  .scenario-pill:nth-child(3) .pill-icon { background: #eefbf3; }
  .pill-text-sub {
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 400;
  }

  /* ── PPT Preview Strip ── */
  .ppt-strip {
    width: 100%;
    max-width: 960px;
    overflow: hidden;
    margin-bottom: 40px;
    mask-image: linear-gradient(90deg, transparent 0%, #000 8%, #000 92%, transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 8%, #000 92%, transparent 100%);
  }
  .ppt-scroll {
    display: flex;
    gap: 16px;
    animation: scrollPPT 40s linear infinite;
  }
  .ppt-scroll:hover { animation-play-state: paused; }
  .ppt-slide-img {
    flex-shrink: 0;
    width: 260px;
    height: 163px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,.12);
    transition: transform .3s, box-shadow .3s;
  }
  .ppt-slide-img:hover {
    transform: scale(1.06) translateY(-4px);
    box-shadow: 0 8px 32px rgba(215,179,106,.25);
  }
  .ppt-slide-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @keyframes scrollPPT {
    0% { transform: translateX(0); }
    100% { transform: translateX(calc(-276px * 6)); }
  }

  /* ── Bottom Links ── */
  .bottom-links {
    display: flex;
    gap: 32px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .bottom-links a {
    font-size: 13px;
    color: var(--text-dim);
    text-decoration: none;
    font-weight: 500;
    transition: color .2s;
  }
  .bottom-links a:hover { color: var(--gold-dark); }

  /* ── Footer ── */
  .foot {
    padding: 20px 32px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    border-top: 1px solid var(--border);
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .brand-name { font-size: 36px; }
    .brand-tagline { font-size: 14px; }
    .search-input { padding: 14px 50px 14px 20px; font-size: 15px; }
    .search-btn { width: 38px; height: 38px; }
    .scenarios { gap: 8px; }
    .scenario-pill { padding: 8px 14px; font-size: 13px; }
    .nav-links { display: none; }
    .ppt-mini { width: 180px; }
  }
  @media (max-width: 480px) {
    .brand-name { font-size: 28px; }
    .scenarios { flex-direction: column; align-items: center; }
    .scenario-pill { width: 100%; max-width: 300px; justify-content: center; }
    .nav-cta .btn-ghost { display: none; }
  }
</style>
</head>
