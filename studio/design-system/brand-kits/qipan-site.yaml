brand_id: qipan-site
version: 0.1
name: qipan.site 默认品牌体系
status: default

positioning: AI 战略棋盘工作台，帮助用户把复杂战略问题变成可判断、可汇报、可落地的报告。

color_tokens:
  primary: "#0B4D45"
  secondary: "#0D2D44"
  accent: "#D6A84F"
  background: "#F7F4EE"
  surface: "#FFFFFF"
  text: "#18202B"
  muted: "#6D7583"
  success: "#2E7D64"
  warning: "#C98A2E"
  risk: "#B85443"
  divider: "#D8D1C3"

usage_rules:
  primary: 主标题、qipan 标识、关键结构线。
  secondary: 深色图片区、底部信息栏、章节页深色背景。
  accent: 斜切分割线、图标强调、关键节点，不做大面积底色。
  background: 浅色报告页底。
  surface: 卡片、表格、浅底模块。
  text: 标题和正文。
  muted: 辅助说明、注释和低优先级信息。

visual_style:
  layout: 稳定、克制、咨询报告感。
  imagery: 行业图可以有质感，但不能抢主标题。
  typography: 中文标题要清晰、稳重、有专业报告感。
  charts: 图表优先使用语义色，不追求花哨。

brand_override_policy:
  user_can_upload:
    - brand_primary
    - brand_secondary
    - brand_accent
  rule: 用户颜色映射到 token，但不改变模板版式。
  checks:
    - 正文对比度足够。
    - 深色背景文字可读。
    - 强品牌色需要降饱和后才能用于大面积背景。
    - accent 只用于强调。
