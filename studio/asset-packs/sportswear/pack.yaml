    role: 可替换右侧 hero image，用于可编辑 PPTX 封面
  - id: nike_china_symbol_v01
    path: background-images/nike-china-symbol-v01.png
    metadata: background-images/nike-china-symbol-v01.yaml
    role: 可替换中心视觉 image，用于 symbol-minimal 极简封面

recommended_theme: studio/design-system/themes/qipan-default.yaml
