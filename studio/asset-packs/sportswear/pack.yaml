pack_id: sportswear
version: 0.1
name: 运动鞋服与运动零售
status: cover_slice

use_cases:
  - 耐克中国增长破局
  - 运动品牌竞争格局
  - 运动零售渠道重构

visual_language:
  keywords:
    - 跑鞋
    - 城市旗舰店
    - 运动零售
    - 夜景玻璃幕墙
    - 深绿
    - 深蓝
